<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Design Challenge Generator</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <meta name="referrer" content="no-referrer" />
  <meta name="description" content="Random product design practice prompts. Like one to unlock a short brief on how to make it excellent." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23C6F432'/%3E%3Cpath d='M10 16.5l4 4 8-9' fill='none' stroke='%231D2A00' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
  <script src="theme.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="Design Challenge Generator home">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M10 16.5l4 4 8-9" /></svg></span>
      <strong>Design Challenge</strong>
    </a>
    <nav class="top-actions">
      <button class="pill-btn" id="likedToggle" type="button" aria-controls="likedPanel" aria-expanded="false">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0112 7.6a4.3 4.3 0 017.5 2.7c0 5.6-7.5 10.2-7.5 10.2z" /></svg>
        <span class="pill-label">Liked</span>
        <span class="badge" id="likedCount" hidden>0</span>
      </button>
      <button class="icon-btn" id="themeToggle" type="button" aria-label="Toggle dark mode">
        <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4" /></svg>
        <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z" /></svg>
      </button>
    </nav>
  </header>

  <div class="bench">
    <!-- Left rail: recent + filters -->
    <aside class="rail" aria-label="Filters">
      <section class="rail-group rail-recent" id="recentGroup">
        <div class="rail-head">
          <h2 class="rail-title">Recent</h2>
          <button class="text-btn" id="clearRecent" type="button">Clear</button>
        </div>
        <ul class="recent" id="recentList"></ul>
        <button class="more-btn" type="button" data-toggle="recentGroup" hidden></button>
      </section>
      <section class="rail-group" id="categoryGroup">
        <h2 class="rail-title">Category</h2>
        <div class="rail-list" id="categoryList" role="radiogroup" aria-label="Category"></div>
        <button class="more-btn" type="button" data-toggle="categoryGroup" hidden></button>
      </section>
      <section class="rail-group">
        <h2 class="rail-title">Level</h2>
        <div class="rail-list" id="levelList" role="radiogroup" aria-label="Level"></div>
      </section>
    </aside>

    <!-- Center: the challenge -->
    <main class="card" id="card" aria-live="polite">
      <div class="card-meta">
        <span class="tag" id="cardCategory">Loading</span>
        <span class="level" id="cardLevel">
          <span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>
          <span id="cardLevelText"></span>
        </span>
      </div>

      <div class="card-body">
        <h1 class="task" id="cardTask">&nbsp;</h1>
        <p class="domain" id="cardDomain">&nbsp;</p>
      </div>

      <p class="constraint" id="cardConstraint">&nbsp;</p>

      <div class="card-actions">
        <button class="btn btn-primary" id="shuffleBtn" type="button">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
          Next challenge
        </button>
        <button class="btn btn-like" id="likeBtn" type="button" aria-pressed="false">
          <svg class="icon heart" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0112 7.6a4.3 4.3 0 017.5 2.7c0 5.6-7.5 10.2-7.5 10.2z" /></svg>
          <span id="likeLabel">Like</span>
        </button>
        <button class="btn btn-ghost" id="copyBtn" type="button" aria-label="Copy prompt">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2" /><path d="M16 8V6a2 2 0 00-2-2H6a2 2 0 00-2 2v8a2 2 0 002 2h2" /></svg>
          <span class="copy-label">Copy</span>
        </button>
      </div>
    </main>

    <!-- Right: the brief, locked until liked -->
    <aside class="brief locked" id="brief" aria-labelledby="briefTitle">
      <div class="brief-head">
        <h2 id="briefTitle">Brief</h2>
        <span class="done-count" id="doneCount"></span>
      </div>

      <div class="brief-body" id="briefBody" aria-hidden="true">
        <div class="brief-meta">
          <span class="meta-chip">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" /><path d="M12 7.5V12l3 2" /></svg>
            <span id="briefTime"></span>
          </span>
          <span class="meta-chip">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2" /><path d="M4 9h16" /></svg>
            <span id="briefDeliverable"></span>
          </span>
        </div>

        <section class="block">
          <h3>Think about</h3>
          <ul class="bullets" id="thinkList"></ul>
          <p class="real" id="realContent"></p>
        </section>

        <section class="block">
          <h3>Avoid</h3>
          <p class="avoid" id="avoidText"></p>
        </section>

        <section class="block">
          <h3>Done when</h3>
          <ul class="checklist" id="checklist"></ul>
        </section>
      </div>

      <div class="lock" id="briefLock">
        <div class="lock-card">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2" /><path d="M8 11V8a4 4 0 018 0v3" /></svg>
          <strong>Like it to unlock the brief</strong>
          <span>What to think about, what to avoid, and when you're done.</span>
          <button class="btn btn-accent" id="unlockBtn" type="button">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0112 7.6a4.3 4.3 0 017.5 2.7c0 5.6-7.5 10.2-7.5 10.2z" /></svg>
            Like &amp; unlock
          </button>
        </div>
      </div>
    </aside>
  </div>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="panel" id="likedPanel" aria-label="Liked challenges" aria-hidden="true">
    <div class="grabber" id="grabber" aria-hidden="true"><span></span></div>
    <header class="panel-head">
      <h2>Liked</h2>
      <button class="icon-btn" id="closePanel" type="button" aria-label="Close">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
      </button>
    </header>
    <ul class="liked-list" id="likedList"></ul>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="lib/prompts.js"></script>
  <script src="lib/brief.js"></script>
  <script src="lib/api.js"></script>
  <script src="app.js"></script>
</body>
</html>
